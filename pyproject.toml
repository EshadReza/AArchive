[project]
name = "aarchive"
version = "0.1.0"
description = "Arbitrator contest archive and academic platform"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2.17,<5.3",
    "djangorestframework>=3.18.1,<3.19",
    "dj-database-url>=3,<4",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-django>=4.12,<5",
    "ruff>=0.15,<1",
]

[tool.uv]
package = false
required-version = ">=0.12.23,<0.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["backend"]
testpaths = ["backend/tests", "scripts"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend"]
include = ["backend/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings/development.py" = ["F403", "F405"]
"backend/config/settings/test.py" = ["F403", "F405"]
"backend/config/settings/production.py" = ["F403", "F405"]
